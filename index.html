    <link rel="stylesheet" crossorigin href="/howard-victoria-anniversary/assets/index-D5iWeCdz.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        async function logVisit() {
          try {
            // Get IP from ipify
            const response = await fetch('https://api.ipify.org?format=json');
            const data = await response.json();
            const ip = data.ip;
            const ua = navigator.userAgent;

            // Google Form IDs
            const formId = '1FAIpQLScx8V-csOUTrXZEtzjld92DzyZs3VTz_ES8cOaNgv34wbpfZw';
            const ipEntry = 'entry.1285564112';
            const uaEntry = 'entry.402856876';

            // Construct form URL
            const url = `https://docs.google.com/forms/d/e/${formId}/formResponse?${ipEntry}=${encodeURIComponent(ip)}&${uaEntry}=${encodeURIComponent(ua)}&submit=Submit`;

            // Silent request using beacon or image
            if (navigator.sendBeacon) {
              navigator.sendBeacon(url);
            } else {
              const img = new Image();
              img.src = url;
            }
          } catch (e) {
            console.error('Tracking failed', e);
          }
        }
        // Run on load
        if (document.readyState === 'complete') {
          logVisit();
        } else {
          window.addEventListener('load', logVisit);
        }
      })();
    </script>
  </body>
</html>

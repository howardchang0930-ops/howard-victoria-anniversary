<html lang="en">
  <head>

    <script type="module" crossorigin src="/howard-victoria-anniversary/assets/index-DbBnb_ZO.js"></script>
    <link rel="stylesheet" crossorigin href="/howard-victoria-anniversary/assets/index-D5iWeCdz.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        async function logVisit() {
          try {
            const response = await fetch('https://api.ipify.org?format=json');
            const data = await response.json();
            const ip = data.ip;
            const ua = navigator.userAgent;
            const localTime = new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' });
            const deviceInfo = `[${localTime}] ${ua}`;

            const formId = '1FAIpQLScx8V-csOUTrXZEtzjld92DzyZs3VTz_ES8cOaNgv34wbpfZw';
            const ipEntry = 'entry.1285564112';
            const uaEntry = 'entry.402856876';

            // Create a hidden iframe to submit the form
            const url = `https://docs.google.com/forms/d/e/${formId}/formResponse?${ipEntry}=${encodeURIComponent(ip)}&${uaEntry}=${encodeURIComponent(deviceInfo)}&submit=Submit`;
            
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = url;
            document.body.appendChild(iframe);
            
            // Cleanup after a while
            setTimeout(() => {
              if (document.body.contains(iframe)) {
                document.body.removeChild(iframe);
              }
            }, 5000);
          } catch (e) {
            // Fallback: minimal log without IP if API fails
            const formId = '1FAIpQLScx8V-csOUTrXZEtzjld92DzyZs3VTz_ES8cOaNgv34wbpfZw';
            const uaEntry = 'entry.402856876';
            const url = `https://docs.google.com/forms/d/e/${formId}/formResponse?${uaEntry}=${encodeURIComponent(navigator.userAgent)}&submit=Submit`;
            const img = new Image();
            img.src = url;
          }
        }
        if (document.readyState === 'complete') {
          logVisit();
        } else {
          window.addEventListener('load', logVisit);
        }
      })();
    </script>
  </body>
</html>
